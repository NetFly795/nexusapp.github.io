<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applets — Nexus 7</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/applets.css">
</head>
<body>
  <div class="container" id="mainContainer">
    <aside class="sidebar">
      <h2>Applets</h2>
      <input type="text" id="addon-search" placeholder="Search applets..." />
      <ul id="addon-list"></ul>
      <div id="pinned-section">
        <h3>Pinned</h3>
        <ul id="pinned-list"></ul>
      </div>
    </aside>
    <main class="content">
      <div id="addon-details">
        <p class="placeholder">Select an applet to view details</p>
      </div>
    </main>
  </div>
  <script src="js/applets.js"></script>
</body>
</html>
