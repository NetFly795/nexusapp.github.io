<!DOCTYPE html>
<html>
<head>
<meta http-equiv="refresh" content="0; url=https://buttonstinks.cc/gaming.html">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../theme-sync.js"></script>




<style>
body, input, button, select, textarea, div, p, span, a, table, th, td {
  font-family: 'Avenir Next Regular', 'Avenir Next', 'Avenir', sans-serif;
  font-weight: 400;
}
h1, h2, h3, h4, h5, h6, strong, b, th, .bold, .sidenav a, .badge {
  font-family: 'Avenir Next Medium', 'Avenir Next', 'Avenir', sans-serif !important;
  font-weight: 500 !important;
}
body {
  background-color: var(--theme-bg, #f2f5f9);
  color: var(--theme-text-primary, #1a1a2e);
}

.sidenav {
  height: 100%;
  width: 160px;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: var(--theme-glass-tint, rgba(255, 255, 255, 0.45));
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  overflow-x: hidden;
  padding-top: 40px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
  border-right: 1px solid var(--theme-glass-border, rgba(255, 255, 255, 0.6));
}

.sidenav a {
  padding: 6px 8px 6px 16px;
  text-decoration: none;
  font-size: 25px;
  color: var(--theme-text-secondary, #4a4a6a);
  display: block;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.sidenav a:hover {
  color: var(--theme-text-primary, #1a1a2e);
  transform: translateX(4px);
}

.main {
  margin-left: 160px; /* Same as the width of the sidenav */
  font-size: 28px; /* Increased text to enable scrolling */
  padding: 0px 10px;
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

.navigationbuttons{
  margin: 0;
  position: absolute;
  top: 50%;
  -ms-transform: translateY(-50%);
  transform: translateY(-50%);
}

.settingsbutton{
  position: absolute;
  bottom: 0;
}

.foryoubutton {
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 0px;
}
    
.foryoubutton:hover {
        border: 0px;
        transform: scale(1.1);
}
    
.foryoubutton:active {
        border: 0px;
        transform: scale(0.9);
}

.gamebutton {
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 0px;
}
    
.gamebutton:hover {
        border: 0px;
        transform: scale(1.1);
}
    
.gamebutton:active {
        border: 0px;
        transform: scale(0.9);
}

.mastodonbutton {
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 0px;
}
    
.mastodonbutton:hover {
        border: 0px;
        transform: scale(1.1);
}
    
.mastodonbutton:active {
        border: 0px;
        transform: scale(0.9);
}

.content {
    height: 100%;
}

.sidenav {
    zoom: 70%;
}

.main {
  height: 100%;
}

body{
        margin: 0; /* Remove default margin */
}
    iframe{      
        display: block;  /* iframes are inline by default */   
        height: 100vh;  /* Set height to 100% of the viewport height */   
        width: 90vw;  /* Set width to 100% of the viewport width */     
        border: none; /* Remove default border */
        background: rgb(255, 255, 255); /* Just for styling */
    }
</style>

</head>
<body>

    <div class="sidenav">
        <center><img src="../nexuslogoapple.png" loading="lazy" decoding="async" style="width:60%; border-radius: 23%; margin-top: 6.7%; box-shadow: 2px 2px 5px 2px lightgray;"></center>
      
        <div class="navigationbuttons">
          <center>
            <a href="../index.html"><div class="foryoubutton"><img src="../icons/foryou.png" loading="lazy" decoding="async" style="width:40%; border-radius: 23px; padding: 30px; box-shadow: 2px 2px 5px 2px lightgray;"></div></a>
            <p>&nbsp;</p>
            <a><div class="gamebutton"><img src="../icons/game.png" loading="lazy" decoding="async" style="width:40%; border-radius: 23px; padding: 30px; border: 2px solid var(--theme-accent); box-shadow: 2px 2px 5px 2px lightgray;"></div></a>
            <p>&nbsp;</p>
            <a href="mastodon.html"><div class="mastodonbutton"><img src="../icons/mastodon.png" loading="lazy" decoding="async" style="width:40%; border-radius: 23px; padding: 30px; box-shadow: 2px 2px 5px 2px lightgray;"></div></a>
          </center>
        </div>
      
        <div class="settingsbutton">
          <center><div class="settings"><img src="../icons/settings.png" loading="lazy" decoding="async" style="width:40%; opacity: 0%; padding: 20%;"></div></center>
        </div>
      </div>

      <div class="main">
        <div class="content">
          <iframe src="../moderngame/index.html"></iframe>
   
        </div>
      </div>
   
</body>
</html>
